services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: waba
      POSTGRES_PASSWORD: waba_password
      POSTGRES_DB: waba_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waba -d waba_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app
      - node_modules:/usr/src/app/node_modules
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    command: npm run start:dev

volumes:
  postgres_data:
  node_modules:
